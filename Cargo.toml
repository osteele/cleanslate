[package]
name = "cleanslate"
version = "0.2.0"
edition = "2021"
authors = ["Oliver Steele <osteele@github.com>"]
description = "A tool to identify and clean build artifacts and caches from various programming languages"

[dependencies]
walkdir = "2.5.0"
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
globset = "0.4"
anyhow = "1.0.104"
humansize = "2.1.3"
colored = "3.1.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
terminal_size = "0.4.4"
rayon = "1.12.0"
chrono = "0.4.45"
indicatif = "0.18.6"
crossbeam-channel = "0.5.16"
inquire = "0.9.4"
console = "0.16.4"

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
filetime = "0.2.25"
cargo-husky = { version = "1.5.0", features = ["precommit-hook", "run-cargo-test", "run-cargo-clippy", "run-cargo-fmt"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (but not for our code):
[profile.dev.package."*"]
opt-level = 3
